<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">DSH Aside · 把追问留在原文旁</title><desc id="desc">选区锚定，让主线与只读旁注各自继续。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#829c67"/></marker></defs><rect width="960" height="540" rx="18" fill="#141b11"/><g font-family="system-ui, -apple-system, sans-serif"><text x="40" y="48" fill="#91a57e" font-size="14" text-anchor="start">YUEWEN ZHANG / PROJECT NOTES</text><text x="40" y="94" fill="#dde6d4" font-size="32" text-anchor="start">DSH Aside · 把追问留在原文旁</text><text x="40" y="124" fill="#a8b99a" font-size="17" text-anchor="start">选区锚定，让主线与只读旁注各自继续。</text><rect x="40" y="159" width="498" height="329" rx="14" fill="#20291b" stroke="#46573a" /><text x="63" y="197" fill="#dde6d4" font-size="22" text-anchor="start">主对话</text><text x="63" y="238" fill="#a8b99a" font-size="19" text-anchor="start">理解 LLM 推理中的内存与调度</text><rect x="63" y="263" width="448" height="49" rx="14" fill="#344527" stroke="#7f9d52" /><text x="78" y="295" fill="#d2f76a" font-size="21" text-anchor="start">KV Cache 按 block 组织与管理</text><text x="63" y="350" fill="#dde6d4" font-size="20" text-anchor="start">继续主线：请求调度 → 延迟与吞吐</text><text x="63" y="454" fill="#a8b99a" font-size="17" text-anchor="start">主线保持原有上下文</text><path d="M511 287 L576 287" fill="none" stroke="#829c67" stroke-width="2"  marker-end="url(#arrow)"/><rect x="588" y="159" width="332" height="329" rx="14" fill="#202a1a" stroke="#789b4e" /><text x="610" y="197" fill="#d2f76a" font-size="22" text-anchor="start">旁注 · 独立只读会话</text><text x="610" y="242" fill="#a8b99a" font-size="16" text-anchor="start">引用选区</text><text x="610" y="276" fill="#dde6d4" font-size="21" text-anchor="start">为什么按 block 管理？</text><text x="610" y="329" fill="#dde6d4" font-size="18" text-anchor="start">就地追问，保留原文锚点</text><text x="610" y="365" fill="#dde6d4" font-size="18" t