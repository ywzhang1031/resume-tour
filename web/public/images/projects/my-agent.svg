<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">My Agent · 可控执行循环</title><desc id="desc">用清晰的运行边界，连接模型决策、工具执行与结果检查。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#829c67"/></marker></defs><rect width="960" height="540" rx="18" fill="#141b11"/><g font-family="system-ui, -apple-system, sans-serif"><text x="40" y="48" fill="#91a57e" font-size="14" text-anchor="start">YUEWEN ZHANG / PROJECT NOTES</text><text x="40" y="94" fill="#dde6d4" font-size="32" text-anchor="start">My Agent · 可控执行循环</text><text x="40" y="124" fill="#a8b99a" font-size="17" text-anchor="start">用清晰的运行边界，连接模型决策、工具执行与结果检查。</text><rect x="40" y="182" width="242" height="88" rx="14" fill="#20291b" stroke="#46573a" /><text x="58" y="217" fill="#dde6d4" font-size="22" text-anchor="start">用户 / 模型</text><text x="58" y="245" fill="#adbea0" font-size="16" text-anchor="start">目标与工具调用</text><path d="M282 226 L344 226" fill="none" stroke="#829c67" stroke-width="2"  marker-end="url(#arrow)"/><rect x="356" y="182" width="242" height="88" rx="14" fill="#2f4120" stroke="#b0d571" /><text x="374" y="217" fill="#d2f76a" font-size="22" text-anchor="start">Agent Runtime</text><text x="374" y="245" fill="#adbea0" font-size="16" text-anchor="start">上下文 / 中断 / 模式</text><path d="M598 226 L660 226" fill="none" stroke="#829c67" stroke-width="2"  marker-end="url(#arrow)"/><rect x="672" y="182" width="248" height="88" rx="14" fill="#20291b" stroke="#46573a" /><text x="690" y="217" fill="#dde6d4" font-size="22" text-anchor="start">权限与工具</text><text x="690" y="245" fill="#adbea0" font-size="16" text-anchor="start">参数约束 / 执行策略</text><path d="M796 270 L796 380 L610 380" fill="none" stroke="#829c67" stroke-width="2" marker-end="url(#arrow)"/><rect x="356" y="336" width="242" height="88" rx="14" fill="#20291b" stroke="#46573a" /><text x="374" y="371" fill="#dd