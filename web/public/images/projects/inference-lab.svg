<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">LLM 推理 · 请求时间线</title><desc id="desc">区分客户端调度滞后、首 token 延迟与完整响应耗时。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#829c67"/></marker></defs><rect width="960" height="540" rx="18" fill="#141b11"/><g font-family="system-ui, -apple-system, sans-serif"><text x="40" y="48" fill="#91a57e" font-size="14" text-anchor="start">YUEWEN ZHANG / PROJECT NOTES</text><text x="40" y="94" fill="#dde6d4" font-size="32" text-anchor="start">LLM 推理 · 请求时间线</text><text x="40" y="124" fill="#a8b99a" font-size="17" text-anchor="start">区分客户端调度滞后、首 token 延迟与完整响应耗时。</text><path d="M65 253 L904 253" fill="none" stroke="#829c67" stroke-width="2"  marker-end="url(#arrow)"/><circle cx="80" cy="253" r="7" fill="#d2f76a"/><text x="80" y="207" fill="#dde6d4" font-size="21" text-anchor="middle">计划到达</text><text x="80" y="291" fill="#a8b99a" font-size="16" text-anchor="middle">scheduled</text><circle cx="296" cy="253" r="7" fill="#d2f76a"/><text x="296" y="207" fill="#dde6d4" font-size="21" text-anchor="middle">实际提交</text><text x="296" y="291" fill="#a8b99a" font-size="16" text-anchor="middle">submitted</text><circle cx="564" cy="253" r="7" fill="#d2f76a"/><text x="564" y="207" fill="#dde6d4" font-size="21" text-anchor="middle">首 token</text><text x="564" y="291" fill="#a8b99a" font-size="16" text-anchor="middle">first token</text><circle cx="860" cy="253" r="7" fill="#d2f76a"/><text x="860" y="207" fill="#dde6d4" font-size="21" text-anchor="middle">完成</text><text x="860" y="291" fill="#a8b99a" font-size="16" text-anchor="middle">finished</text><text x="175" y="335" fill="#a8b99a" font-size="17" text-anchor="middle">调度滞后</text><text x="425" y="335" fill="#d2f76a" font-size="18" text-anchor="middle">TTFT</text><text x="713" y="335" fill="#d2f76a" font-size="18" text-anchor="middle">逐 token / 流式记录</text><rect x="40" y="388" width="272" height="88" rx="14" fill="#20291b" stroke="#46573a" /><text x="58" y="423" fill="#dde6d4" font-size="22" text-anchor="start">负载与调度</text><text x="58" y="451" fill="#adbea0" font-size="16" text-anchor="start">Closed-loop / Open-loop</text><rect x="344" y="388" width="272" height="88" rx="14" fill="#2f4120" stroke="#b0d571" /><text x="362" y="423" fill="#d2f76a" font-size="22" text-anchor="start">HTTP / SSE</text><text x="362" y="451" fill="#adbea0" font-size="16" text-anchor="start">原始请求记录与错误统计</text><rect x="648" y="388" width="272" height="88" rx="14" fill="#20291b" stroke="#46573a" /><text x="666" y="423" fill="#dde6d4" font-size="22" text-anchor="start">指标分析</text><text x="666" y="451" fill="#adbea0" font-size="16" text-anchor="start">TTFT / TPOT / E2E</text></g></svg>
